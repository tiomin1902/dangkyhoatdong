<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng ký tham gia hoạt động</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:30px 0;min-height:100vh;
 display:flex;justify-content:center;align-items:center;
 font-family:"Times New Roman",serif;
 background:linear-gradient(#0009,#0009),
 url("https://media.apag.edu.vn/Image/023ced82-d60e-9622-cc13-0ce98d1cef93/2025/10/3/Hinh-anh-Phan-hieu-c2f3e4f995.jpg") center/cover fixed
}
.container{
 width:90%;max-width:700px;padding:40px 35px;
 background:linear-gradient(135deg,#fffdf7,#f4ecd8);
 border:2px solid #b8860b;border-radius:8px;
 box-shadow:0 0 0 5px #fffc,0 0 0 7px #b8860b,0 15px 40px #000b
}
h2{
 margin:0 0 20px;text-align:center;color:#8b0000;
 font-size:26px;line-height:1.4;border-bottom:2px dashed #b8860b;
 padding-bottom:15px
}
.form-group{margin-bottom:20px}
label{
 display:block;margin-bottom:8px;font-weight:bold;
 color:#333;font-size:16px;letter-spacing:1px
}
input{
 width:100%;padding:12px;border:1px solid #b8860b;
 background:#fffaf0;border-radius:3px;font:16px "Times New Roman"
}
input:focus{outline:none;border-color:#8b0000}
button{
 width:100%;padding:15px;background:linear-gradient(#d4af37,#b8860b);
 color:white;border:1px solid #8b6508;border-radius:4px;
 cursor:pointer;font: bold 18px "Times New Roman";
 letter-spacing:2px
}
button:disabled{background:#ccc;border-color:#999;color:#666;cursor:not-allowed}
.message{text-align:center;font-weight:bold;font-size:18px;margin-top:20px}
.error{color:#8b0000}.success{color:#006400}
.info-box{
 margin-bottom:25px;padding:15px 10px;text-align:center;
 background:#b8860b1a;border:1px solid #b8860b;
 border-radius:5px;font-size:17px;line-height:1.6
}
.countdown{
 display:inline-block;margin-top:12px;padding:8px 20px;
 background:#fffaf0;color:#8b0000;border:2px dotted #b8860b;
 border-radius:30px;font-weight:bold
}
.registered-box{
 margin-top:25px;padding:18px;background:#fffaf0f2;
 border:1px solid #b8860b;border-radius:6px
}
.registered-title{
 text-align:center;color:#8b0000;font-weight:bold;
 padding-bottom:10px;border-bottom:1px dashed #b8860b
}
.registered-count{text-align:center;color:#666;font-size:14px;margin:10px}
.registered-list{max-height:260px;overflow:auto;font-size:14px}
.table-row{
 display:grid;grid-template-columns:45px 1.6fr 1fr 1.3fr;
 gap:8px;padding:10px 5px;border-bottom:1px solid #b8860b33
}
.table-head{font-weight:bold;color:#8b0000;background:#b8860b14;border-bottom:2px solid #b8860b}
.table-row>div{word-break:break-word}
.empty-list,.loading-list{text-align:center;color:#777;padding:10px}
@media(max-width:600px){
 .container{width:94%;padding:30px 20px}
 h2{font-size:22px}
 .registered-list{min-width:550px}
}
</style>
</head>

<body>

<div class="container">

<h2>ĐĂNG KÝ THAM GIA HOẠT ĐỘNG<br>CHI ĐOÀN 2505QLNH</h2>

<div class="info-box" id="statusInfo">Đang kiểm tra hệ thống...</div>

<form id="registrationForm">
 <div class="form-group">
  <label>Họ và tên:</label>
  <input type="text" id="fullName" placeholder="Vui lòng nhập họ và tên" required disabled>
 </div>

 <div class="form-group">
  <label>Mã số sinh viên:</label>
  <input type="text" id="studentId" placeholder="Vui lòng nhập mã số sinh viên" required disabled>
 </div>

 <button id="submitBtn" disabled>Xác Nhận Đăng Ký</button>
</form>

<div id="message" class="message"></div>

<div class="registered-box">
 <div class="registered-title">DANH SÁCH ĐÃ ĐĂNG KÝ THÀNH CÔNG</div>
 <div id="registeredCount" class="registered-count">Đang cập nhật...</div>
 <div id="registeredList" class="registered-list">Đang tải danh sách...</div>
</div>

</div>

<script>

/* ===== CHỈ CẦN SỬA 3 DÒNG NÀY ===== */

const SCRIPT_URL="https://script.google.com/macros/s/AKfycbw47YRZPh9w-SLci-ll0_bumZiIbqOUUO0w_cshvZx5Glo_DIi3tWPXa7iGCQYspapY/exec";

const MAX_PEOPLE=5;

const START_TIME=new Date("2026-10-07T23:45:00").getTime();

const EVENT_ID="HoatDong_08";


/* ===== HỆ THỐNG ===== */

const $=id=>document.getElementById(id),
form=$("registrationForm"),
name=$("fullName"),
student=$("studentId"),
btn=$("submitBtn"),
msg=$("message"),
status=$("statusInfo"),
list=$("registeredList"),
count=$("registeredCount");

let registered=0,full=false;
let hasRegistered=localStorage.getItem(EVENT_ID)==="true";


function renderStatus(){

 if(hasRegistered){
  name.disabled=student.disabled=btn.disabled=true;
  status.innerHTML='<b class="success">BẠN ĐÃ ĐĂNG KÝ THÀNH CÔNG</b><br>Mỗi người chỉ được đăng ký 1 lần.';
  return;
 }

 let now=Date.now();

 if(now<START_TIME){
  name.disabled=student.disabled=btn.disabled=true;
  let d=START_TIME-now;
  let h=Math.floor(d/3600000),
      m=Math.floor(d%3600000/60000),
      s=Math.floor(d%60000/1000);

  status.innerHTML=`<b class="error">CHƯA MỞ ĐĂNG KÝ</b><br>
  Hệ thống mở lúc: ${new Date(START_TIME).toLocaleString("vi-VN")}
  <br><div class="countdown">⏳ Còn ${h} giờ ${m} phút ${s} giây</div>`;
  return;
 }

 if(full||registered>=MAX_PEOPLE){
  name.disabled=student.disabled=btn.disabled=true;
  status.innerHTML=`<b class="error">ĐÃ ĐÓNG ĐĂNG KÝ</b><br>Sự kiện đã đủ ${MAX_PEOPLE} sinh viên.`;
  return;
 }

 name.disabled=student.disabled=btn.disabled=false;
 status.innerHTML=`<b>Đang mở đăng ký</b><br>Đã ghi nhận: ${registered}/${MAX_PEOPLE} sinh viên`;
}


function escapeHtml(v){
 return String(v||"")
 .replace(/&/g,"&amp;").replace(/</g,"&lt;")
 .replace(/>/g,"&gt;").replace(/"/g,"&quot;")
 .replace(/'/g,"&#039;");
}


function renderList(data){

 if(!data.length){
  count.textContent="Chưa có bạn nào đăng ký.";
  list.innerHTML='<div class="empty-list">Danh sách hiện đang trống.</div>';
  return;
 }

 count.textContent=`Đã có ${data.length}/${MAX_PEOPLE} bạn đăng ký`;

 list.innerHTML=`
 <div class="table-row table-head">
  <div>STT</div><div>HỌ VÀ TÊN</div><div>MSSV</div><div>THỜI GIAN</div>
 </div>
 ${data.map((x,i)=>`
 <div class="table-row">
  <div>${i+1}</div>
  <div>${escapeHtml(x.name)}</div>
  <div>${escapeHtml(x.studentId)}</div>
  <div>${escapeHtml(x.time)}</div>
 </div>`).join("")}`;
}


function sync(){

 fetch(SCRIPT_URL+"?event="+encodeURIComponent(EVENT_ID)+"&t="+Date.now())
 .then(r=>r.json())
 .then(d=>{
  registered=Number(d.count||0);
  full=registered>=MAX_PEOPLE;
  renderList(d.registrations||[]);
  renderStatus();
 })
 .catch(()=>{
  list.innerHTML='<div class="empty-list">Không thể tải danh sách.</div>';
 });
}


form.addEventListener("submit",e=>{

 e.preventDefault();

 btn.disabled=true;
 btn.textContent="Đang xử lý...";
 msg.textContent="";

 let data=new FormData();

 data.append("name",name.value.trim());
 data.append("studentId",student.value.trim());
 data.append("time",new Date().toLocaleString("vi-VN"));
 data.append("maxLimit",MAX_PEOPLE);
 data.append("event",EVENT_ID);

 fetch(SCRIPT_URL,{method:"POST",body:data})
 .then(r=>r.json())
 .then(d=>{

  msg.textContent=d.message||"";

  if(d.status==="success"){
   msg.className="message success";
   localStorage.setItem(EVENT_ID,"true");
   hasRegistered=true;
   form.reset();
   renderStatus();
   sync();
  }else{
   msg.className="message error";
   btn.disabled=false;
   btn.textContent="Xác Nhận Đăng Ký";
   sync();
  }

 })
 .catch(()=>{
  msg.textContent="Có lỗi xảy ra. Vui lòng thử lại.";
  msg.className="message error";
  btn.disabled=false;
  btn.textContent="Xác Nhận Đăng Ký";
 });
});


sync();

setInterval(renderStatus,1000);
setInterval(sync,3000);

</script>

</body>
</html>
