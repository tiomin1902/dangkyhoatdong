<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đăng ký tham gia hoạt động</title>

<style>
/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html {
    margin: 0;
    padding: 0;
}

body {
    margin: 0;
    padding: 30px 0;
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    font-family: "Times New Roman", Times, serif;

    background:
        linear-gradient(rgba(0,0,0,0.60), rgba(0,0,0,0.60)),
        url("https://media.apag.edu.vn/Image/023ced82-d60e-9622-cc13-0ce98d1cef93/2025/10/3/Hinh-anh-Phan-hieu-c2f3e4f995.jpg")
        center center / cover fixed;
}


/* =========================================================
   KHUNG CHÍNH
========================================================= */

.container {
    width: 90%;
    max-width: 700px;

    padding: 40px 35px;

    background: linear-gradient(
        135deg,
        #fffdf7,
        #f4ecd8
    );

    border: 2px solid #b8860b;
    border-radius: 8px;

    box-shadow:
        0 0 0 5px rgba(255,255,255,0.95),
        0 0 0 7px #b8860b,
        0 15px 40px rgba(0,0,0,0.70);
}


/* =========================================================
   TIÊU ĐỀ
========================================================= */

h2 {
    margin: 0 0 20px;

    text-align: center;

    color: #8b0000;

    font-size: 26px;
    line-height: 1.4;

    border-bottom: 2px dashed #b8860b;

    padding-bottom: 15px;
}


/* =========================================================
   THÔNG TIN TRẠNG THÁI
========================================================= */

.info-box {
    margin-bottom: 25px;
    padding: 15px 10px;

    text-align: center;

    background: rgba(184,134,11,0.10);

    border: 1px solid #b8860b;
    border-radius: 5px;

    font-size: 17px;
    line-height: 1.6;
}


/* =========================================================
   COUNTDOWN
========================================================= */

.countdown {
    display: inline-block;

    margin-top: 12px;
    padding: 8px 20px;

    background: #fffaf0;

    color: #8b0000;

    border: 2px dotted #b8860b;

    border-radius: 30px;

    font-weight: bold;

    font-size: 17px;
}


/* =========================================================
   FORM
========================================================= */

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;

    margin-bottom: 8px;

    font-weight: bold;

    color: #333;

    font-size: 16px;

    letter-spacing: 1px;
}

input {
    width: 100%;

    padding: 12px;

    border: 1px solid #b8860b;

    background: #fffaf0;

    border-radius: 3px;

    font: 16px "Times New Roman", Times, serif;
}

input:focus {
    outline: none;

    border-color: #8b0000;

    box-shadow: 0 0 0 2px rgba(139,0,0,0.08);
}

input:disabled {
    background: #eeeeee;

    color: #777;

    cursor: not-allowed;
}


/* =========================================================
   BUTTON
========================================================= */

button {
    width: 100%;

    padding: 15px;

    background: linear-gradient(
        #d4af37,
        #b8860b
    );

    color: white;

    border: 1px solid #8b6508;

    border-radius: 4px;

    cursor: pointer;

    font: bold 18px "Times New Roman", Times, serif;

    letter-spacing: 2px;
}

button:hover:not(:disabled) {
    background: linear-gradient(
        #e1c04b,
        #c99a16
    );
}

button:disabled {
    background: #cccccc;

    border-color: #999999;

    color: #666666;

    cursor: not-allowed;
}


/* =========================================================
   MESSAGE
========================================================= */

.message {
    text-align: center;

    font-weight: bold;

    font-size: 18px;

    margin-top: 20px;

    line-height: 1.5;
}

.error {
    color: #8b0000;
}

.success {
    color: #006400;
}


/* =========================================================
   DANH SÁCH ĐĂNG KÝ
========================================================= */

.registered-box {
    margin-top: 25px;

    padding: 18px;

    background: rgba(255,250,240,0.95);

    border: 1px solid #b8860b;

    border-radius: 6px;
}

.registered-title {
    text-align: center;

    color: #8b0000;

    font-weight: bold;

    padding-bottom: 10px;

    border-bottom: 1px dashed #b8860b;
}

.registered-count {
    text-align: center;

    color: #666;

    font-size: 14px;

    margin: 10px;
}

.registered-list {
    max-height: 260px;

    overflow: auto;

    font-size: 14px;
}


/* =========================================================
   BẢNG
========================================================= */

.table-row {
    display: grid;

    grid-template-columns:
        45px
        1.6fr
        1fr
        1.3fr;

    gap: 8px;

    padding: 10px 5px;

    border-bottom: 1px solid rgba(184,134,11,0.20);
}

.table-head {
    font-weight: bold;

    color: #8b0000;

    background: rgba(184,134,11,0.08);

    border-bottom: 2px solid #b8860b;
}

.table-row > div {
    word-break: break-word;
}

.empty-list,
.loading-list {
    text-align: center;

    color: #777;

    padding: 10px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 600px) {

    body {
        padding: 20px 0;
    }

    .container {
        width: 94%;

        padding: 30px 20px;
    }

    h2 {
        font-size: 22px;
    }

    .registered-list {
        overflow-x: auto;
    }

    .table-row {
        min-width: 550px;
    }
}
</style>

</head>


<body>

<div class="container">

    <!-- =====================================================
         TIÊU ĐỀ
    ====================================================== -->

    <h2>
        ĐĂNG KÝ THAM GIA HOẠT ĐỘNG
        <br>
        CHI ĐOÀN 2505QLNH
    </h2>


    <!-- =====================================================
         TRẠNG THÁI HỆ THỐNG
    ====================================================== -->

    <div
        class="info-box"
        id="statusInfo"
    >
        Đang kiểm tra hệ thống...
    </div>


    <!-- =====================================================
         FORM ĐĂNG KÝ
    ====================================================== -->

    <form id="registrationForm">

        <div class="form-group">

            <label for="fullName">
                Họ và tên:
            </label>

            <input
                type="text"
                id="fullName"
                placeholder="Vui lòng nhập họ và tên"
                autocomplete="name"
                required
                disabled
            >

        </div>


        <div class="form-group">

            <label for="studentId">
                Mã số sinh viên:
            </label>

            <input
                type="text"
                id="studentId"
                placeholder="Vui lòng nhập mã số sinh viên"
                autocomplete="off"
                required
                disabled
            >

        </div>


        <button
            type="submit"
            id="submitBtn"
            disabled
        >
            XÁC NHẬN ĐĂNG KÝ
        </button>

    </form>


    <!-- =====================================================
         THÔNG BÁO
    ====================================================== -->

    <div
        id="message"
        class="message"
    ></div>


    <!-- =====================================================
         DANH SÁCH ĐÃ ĐĂNG KÝ
    ====================================================== -->

    <div class="registered-box">

        <div class="registered-title">
            DANH SÁCH ĐÃ ĐĂNG KÝ THÀNH CÔNG
        </div>

        <div
            id="registeredCount"
            class="registered-count"
        >
            Đang cập nhật...
        </div>

        <div
            id="registeredList"
            class="registered-list"
        >
            <div class="loading-list">
                Đang tải danh sách...
            </div>
        </div>

    </div>

</div>


<script>

/* =========================================================
   =========================================================
   CẤU HÌNH HOẠT ĐỘNG
   =========================================================
   CHỈ CẦN SỬA 4 DÒNG NÀY KHI TẠO HOẠT ĐỘNG MỚI
   ========================================================= */


/*
   1. LINK GOOGLE APPS SCRIPT
*/

const SCRIPT_URL =
    "https://script.google.com/macros/s/AKfycbw47YRZPh9w-SLci-ll0_bumZiIbqOUUO0w_cshvZx5Glo_DIi3tWPXa7iGCQYspapY/exec";


/*
   2. SỐ LƯỢNG NGƯỜI TỐI ĐA
*/

const MAX_PEOPLE = 5;


/*
   3. THỜI GIAN MỞ ĐĂNG KÝ

   Định dạng:

   YYYY-MM-DDTHH:MM:SS

   Ví dụ:

   07/10/2026 lúc 23:45

   =

   2026-10-07T23:45:00
*/

const START_TIME_STRING =
    "2026-10-07T23:45:00";


/*
   4. MÃ HOẠT ĐỘNG

   MỖI HOẠT ĐỘNG PHẢI CÓ MÃ RIÊNG.

   Ví dụ:

   HoatDong_01
   HoatDong_02
   HoatDong_03

   KHÔNG dùng trùng mã.
*/

const EVENT_ID =
    "HoatDong_08";


/* =========================================================
   XỬ LÝ THỜI GIAN
========================================================= */

const START_TIME =
    new Date(START_TIME_STRING).getTime();


/* =========================================================
   LẤY ELEMENT
========================================================= */

const form =
    document.getElementById("registrationForm");

const nameInput =
    document.getElementById("fullName");

const studentInput =
    document.getElementById("studentId");

const submitButton =
    document.getElementById("submitBtn");

const message =
    document.getElementById("message");

const statusInfo =
    document.getElementById("statusInfo");

const registeredList =
    document.getElementById("registeredList");

const registeredCount =
    document.getElementById("registeredCount");


/* =========================================================
   BIẾN HỆ THỐNG
========================================================= */

let registered = 0;

let isFull = false;

let isLoading = false;


/*
   KEY RIÊNG CHO TỪNG HOẠT ĐỘNG.

   Ví dụ:

   HoatDong_08_registered

   Khi đổi sang HoatDong_09:

   HoatDong_09_registered

   => Không bị hoạt động cũ khóa nhầm.
*/

const LOCAL_STORAGE_KEY =
    EVENT_ID + "_registered";


/*
   Kiểm tra người này đã đăng ký trên
   trình duyệt hiện tại hay chưa.
*/

let hasRegistered =
    localStorage.getItem(LOCAL_STORAGE_KEY) === "true";


/* =========================================================
   HÀM FORMAT THỜI GIAN
========================================================= */

function formatTime(milliseconds) {

    if (milliseconds <= 0) {
        return {
            hours: 0,
            minutes: 0,
            seconds: 0
        };
    }

    const hours =
        Math.floor(milliseconds / 3600000);

    const minutes =
        Math.floor(
            (milliseconds % 3600000) / 60000
        );

    const seconds =
        Math.floor(
            (milliseconds % 60000) / 1000
        );

    return {
        hours,
        minutes,
        seconds
    };
}


/* =========================================================
   HIỂN THỊ COUNTDOWN
========================================================= */

function renderCountdown() {

    const now = Date.now();

    const remaining =
        START_TIME - now;


    /*
       Nếu chưa tới giờ
    */

    if (remaining > 0) {

        const time =
            formatTime(remaining);

        statusInfo.innerHTML = `
            <b class="error">
                CHƯA MỞ ĐĂNG KÝ
            </b>

            <br>

            Hệ thống sẽ mở lúc:

            <br>

            <b>
                ${new Date(START_TIME).toLocaleString("vi-VN")}
            </b>

            <br>

            <div class="countdown">
                ⏳ Còn
                ${time.hours} giờ
                ${time.minutes} phút
                ${time.seconds} giây
            </div>
        `;

        nameInput.disabled = true;

        studentInput.disabled = true;

        submitButton.disabled = true;

        return;
    }


    /*
       Nếu đã tới giờ mở
    */

    if (!isFull && !hasRegistered) {

        nameInput.disabled = false;

        studentInput.disabled = false;

        submitButton.disabled = false;

        statusInfo.innerHTML = `
            <b class="success">
                ĐANG MỞ ĐĂNG KÝ
            </b>

            <br>

            Đã ghi nhận:
            <b>${registered}/${MAX_PEOPLE}</b>
            sinh viên
        `;

        return;
    }
}


/* =========================================================
   HIỂN THỊ TRẠNG THÁI
========================================================= */

function renderStatus() {

    /*
       ƯU TIÊN 1:
       Người này đã đăng ký.
    */

    if (hasRegistered) {

        nameInput.disabled = true;

        studentInput.disabled = true;

        submitButton.disabled = true;

        statusInfo.innerHTML = `
            <b class="success">
                BẠN ĐÃ ĐĂNG KÝ THÀNH CÔNG
            </b>

            <br>

            Mỗi người chỉ được đăng ký 1 lần.
        `;

        return;
    }


    /*
       ƯU TIÊN 2:
       Chưa tới giờ.
    */

    if (Date.now() < START_TIME) {

        renderCountdown();

        return;
    }


    /*
       ƯU TIÊN 3:
       Đã đủ người.
    */

    if (isFull || registered >= MAX_PEOPLE) {

        nameInput.disabled = true;

        studentInput.disabled = true;

        submitButton.disabled = true;

        statusInfo.innerHTML = `
            <b class="error">
                ĐÃ ĐÓNG ĐĂNG KÝ
            </b>

            <br>

            Sự kiện đã đủ
            <b>${MAX_PEOPLE}</b>
            sinh viên.
        `;

        return;
    }


    /*
       ƯU TIÊN 4:
       Đang mở.
    */

    nameInput.disabled = false;

    studentInput.disabled = false;

    submitButton.disabled = false;

    statusInfo.innerHTML = `
        <b class="success">
            ĐANG MỞ ĐĂNG KÝ
        </b>

        <br>

        Đã ghi nhận:
        <b>${registered}/${MAX_PEOPLE}</b>
        sinh viên
    `;
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   HIỂN THỊ DANH SÁCH
========================================================= */

function renderList(data) {

    /*
       Nếu không có dữ liệu
    */

    if (!Array.isArray(data) || data.length === 0) {

        registeredCount.textContent =
            "Chưa có bạn nào đăng ký.";

        registeredList.innerHTML = `
            <div class="empty-list">
                Danh sách hiện đang trống.
            </div>
        `;

        return;
    }


    /*
       Hiển thị số lượng
    */

    registeredCount.textContent =
        `Đã có ${data.length}/${MAX_PEOPLE} bạn đăng ký`;


    /*
       Tạo bảng
    */

    registeredList.innerHTML = `

        <div class="table-row table-head">

            <div>
                STT
            </div>

            <div>
                HỌ VÀ TÊN
            </div>

            <div>
                MSSV
            </div>

            <div>
                THỜI GIAN
            </div>

        </div>


        ${data.map((item, index) => `

            <div class="table-row">

                <div>
                    ${index + 1}
                </div>

                <div>
                    ${escapeHtml(item.name)}
                </div>

                <div>
                    ${escapeHtml(item.studentId)}
                </div>

                <div>
                    ${escapeHtml(item.time)}
                </div>

            </div>

        `).join("")}
    `;
}


/* =========================================================
   ĐỒNG BỘ GOOGLE SHEETS
========================================================= */

function sync() {

    /*
       Tránh gọi quá nhiều request cùng lúc.
    */

    if (isLoading) {
        return;
    }

    isLoading = true;


    /*
       URL:

       SCRIPT_URL
       +
       ?event=HoatDong_08
       +
       timestamp chống cache
    */

    const url =
        SCRIPT_URL
        + "?event="
        + encodeURIComponent(EVENT_ID)
        + "&t="
        + Date.now();


    fetch(url)

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP error: " +
                    response.status
                );
            }

            return response.json();
        })

        .then(data => {

            /*
               Số người đã đăng ký
            */

            registered =
                Number(data.count || 0);


            /*
               Kiểm tra đủ người
            */

            isFull =
                registered >= MAX_PEOPLE;


            /*
               Hiển thị danh sách
            */

            renderList(
                data.registrations || []
            );


            /*
               Hiển thị trạng thái
            */

            renderStatus();
        })

        .catch(error => {

            console.error(
                "SYNC ERROR:",
                error
            );

            registeredList.innerHTML = `
                <div class="empty-list">
                    Không thể tải danh sách.
                    <br>
                    Vui lòng thử tải lại trang.
                </div>
            `;

        })

        .finally(() => {

            isLoading = false;

        });
}


/* =========================================================
   XỬ LÝ ĐĂNG KÝ
========================================================= */

form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();


        /*
           Không cho gửi nếu chưa tới giờ.
        */

        if (Date.now() < START_TIME) {

            message.textContent =
                "Chưa đến giờ mở đăng ký.";

            message.className =
                "message error";

            renderStatus();

            return;
        }


        /*
           Không cho gửi nếu đủ người.
        */

        if (registered >= MAX_PEOPLE) {

            message.textContent =
                "Hoạt động đã đủ số lượng đăng ký.";

            message.className =
                "message error";

            renderStatus();

            return;
        }


        /*
           Không cho gửi nếu trình duyệt
           đã ghi nhận người này đăng ký.
        */

        if (hasRegistered) {

            message.textContent =
                "Bạn đã đăng ký hoạt động này rồi.";

            message.className =
                "message error";

            renderStatus();

            return;
        }


        /*
           Lấy dữ liệu
        */

        const fullName =
            nameInput.value.trim();

        const studentId =
            studentInput.value.trim();


        /*
           Kiểm tra họ tên
        */

        if (!fullName) {

            message.textContent =
                "Vui lòng nhập họ và tên.";

            message.className =
                "message error";

            nameInput.focus();

            return;
        }


        /*
           Kiểm tra MSSV
        */

        if (!studentId) {

            message.textContent =
                "Vui lòng nhập mã số sinh viên.";

            message.className =
                "message error";

            studentInput.focus();

            return;
        }


        /*
           Khóa nút trong lúc gửi.
        */

        submitButton.disabled = true;

        submitButton.textContent =
            "ĐANG XỬ LÝ...";

        message.textContent = "";


        /*
           Tạo FormData
        */

        const formData =
            new FormData();


        formData.append(
            "name",
            fullName
        );

        formData.append(
            "studentId",
            studentId
        );

        formData.append(
            "time",
            new Date().toLocaleString("vi-VN")
        );

        formData.append(
            "maxLimit",
            MAX_PEOPLE
        );

        formData.append(
            "event",
            EVENT_ID
        );


        /*
           Gửi sang Google Apps Script
        */

        fetch(
            SCRIPT_URL,
            {
                method: "POST",
                body: formData
            }
        )

        .then(response => {

            if (!response.ok) {

                throw new Error(
                    "HTTP error: " +
                    response.status
                );
            }

            return response.json();
        })

        .then(data => {

            /*
               Hiển thị thông báo
            */

            message.textContent =
                data.message || "";


            /*
               Đăng ký thành công
            */

            if (data.status === "success") {

                message.className =
                    "message success";


                /*
                   LƯU RIÊNG CHO HOẠT ĐỘNG HIỆN TẠI.

                   Ví dụ:

                   HoatDong_08_registered=true

                   Khi đổi sang:

                   HoatDong_09

                   sẽ không bị khóa.
                */

                localStorage.setItem(
                    LOCAL_STORAGE_KEY,
                    "true"
                );


                hasRegistered = true;


                /*
                   Xóa form
                */

                form.reset();


                /*
                   Cập nhật giao diện
                */

                renderStatus();


                /*
                   Cập nhật danh sách
                */

                sync();

            }

            /*
               Đăng ký thất bại
            */

            else {

                message.className =
                    "message error";

                submitButton.disabled = false;

                submitButton.textContent =
                    "XÁC NHẬN ĐĂNG KÝ";

                sync();
            }

        })

        .catch(error => {

            console.error(
                "REGISTER ERROR:",
                error
            );


            message.textContent =
                "Có lỗi xảy ra khi kết nối hệ thống. Vui lòng thử lại.";

            message.className =
                "message error";


            submitButton.disabled = false;

            submitButton.textContent =
                "XÁC NHẬN ĐĂNG KÝ";
        });

    }
);


/* =========================================================
   KHỞI ĐỘNG HỆ THỐNG
========================================================= */


/*
   Đồng bộ danh sách ngay khi mở trang.
*/

sync();


/*
   Cập nhật countdown mỗi giây.
*/

setInterval(
    renderStatus,
    1000
);


/*
   Đồng bộ danh sách Google Sheets
   mỗi 3 giây.
*/

setInterval(
    sync,
    3000
);

</script>

</body>
</html>
```
